name: release

# Tag-driven signed release. This workflow does not create tags.
# Merging a Release PR (Kyle's yes) is what should create the tag.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: build-sign-publish
    if: github.repository == 'mojomast/hyvv'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
          cp scripts/install.sh scripts/install.ps1 dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign keyless sign checksums and installers
        run: |
          set -euo pipefail
          for f in dist/checksums.txt dist/install.sh dist/install.ps1; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Upload only; the Release itself should already exist from the tag.
          gh release upload "$tag" dist/* --clobber
