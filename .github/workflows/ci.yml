name: CI

on:
  pull_request:
    # `labeled`/`unlabeled` re-evaluate the owner-held hold: adding the label
    # fails the required ci-gate check, removing it lets the pull request pass.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Main keeps its push run. Feature branches are covered by their PR, so a
  # feature-branch push must not start a second identical matrix.
  push:
    branches: [main]
  # Merge-queue candidates run the same required contexts.
  merge_group:

# A superseded PR/queue candidate is cancelled; the required main run is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege at the workflow level; jobs request only what they need.
permissions: {}

jobs:
  windows-provisioning:
    # The full Windows matrix stays deferred (Kyle, Nov 12). These focused
    # tests need native Windows path/reparse and cross-process lock semantics.
    name: provisioning (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Provisioning tests
        shell: bash
        run: |
          uv sync --frozen --no-dev || uv sync --no-dev
          uv run python -m unittest tests.test_provisioning tests.test_provisioning_api tests.test_provisioning_convergence -v

      - name: Landing publication, export storage and cross-process locking
        run: uv run python -m unittest tests.test_landing_publication tests.test_landing_export_storage -v

      - name: Rails journal, launcher controller and authenticated loopback export
        run: uv run python -m unittest tests.test_rails_emission tests.test_rails_native -v

  test:
    name: test
    runs-on: ${{ matrix.os }}
    # Windows legs are deferred (Kyle, Nov 12): windows-latest is out of the matrix.
    # A job-level `if` cannot read `matrix`, and GitHub rejects the whole workflow
    # when it tries, so the leg is removed rather than skipped. Re-add it here.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync and unit tests
        run: |
          uv sync --frozen --no-dev || uv sync --no-dev
          # PyYAML is a CI-only lift: the OpenAPI parse test uses the ambient
          # loader when present, and this uv overlay is its fallback, so the
          # repo keeps no runtime or dev dependency on it.
          uv run --with pyyaml==6.0.2 python -m unittest discover -s tests -v

      - name: Contract tests (/v1, in-process hyvv)
        # Same command a reviewer runs locally. Point it at a live host with
        # HYVV_BASE_URL plus HYVV_TOKEN_FILE (read-only unless --writes).
        run: uv run python -m contract -v

      - name: Release assets (build only; no tag, sign or upload)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist release-assets
          uv build
          uv run python scripts/build_release_assets.py --dist dist --out release-assets
          # dist/ is what PyPI gets: exactly the sdist and the wheel.
          test "$(ls dist | wc -l | tr -d ' ')" = 2
          ls dist/*.tar.gz dist/*.whl
          ls dist release-assets

      - name: Installer dry run
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File scripts/install.ps1 -WhatIf
          else
            sh scripts/install.sh --dry-run
          fi

  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: gitleaks
        run: |
          set -euo pipefail
          ver=8.28.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Host and tailnet grep
        run: bash scripts/scan-secrets.sh

  contract-yaml:
    name: contract-yaml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Parse contract/v1/openapi.yaml
        run: uv run --with pyyaml==6.0.2 python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('contract/v1/openapi.yaml').read_text(encoding='utf-8'))"

      - name: API surface unchanged
        run: |
          uv run --with pyyaml==6.0.2 python - <<'PY'
          import json
          import pathlib
          import yaml

          root = pathlib.Path(".")
          document = yaml.safe_load((root / "contract/v1/openapi.yaml").read_text(encoding="utf-8"))
          status = json.loads((root / "contract/v1/STATUS.json").read_text(encoding="utf-8"))
          methods = {"get", "put", "post", "delete", "options", "head", "patch", "trace"}
          operations = {
              (method.upper(), path)
              for path, path_item in document["paths"].items()
              for method in methods
              if method in path_item
          }
          expected_operations = {
              tuple(endpoint.split(" ", 1)) for endpoint in status["endpoints"]
          }
          if len(expected_operations) != len(status["endpoints"]):
              raise SystemExit(f"STATUS.json has {len(expected_operations)} endpoints, expected {len(status['endpoints'])}")
          if operations != expected_operations:
              raise SystemExit(
                  "API operations mismatch; "
                  f"missing={sorted(expected_operations - operations)}, "
                  f"added={sorted(operations - expected_operations)}"
              )

          expected_refs = {
              "schemas/artifact.json",
              "schemas/attempt.json",
              "schemas/error.json",
              "schemas/lease-create.json",
              "schemas/lease.json",
              "schemas/lease-list.json",
              "schemas/lease-renew.json",
              "schemas/version.json",
          }
          refs = set()
          nodes = [document]
          while nodes:
              node = nodes.pop()
              if isinstance(node, dict):
                  refs.update(
                      value for key, value in node.items()
                      if key == "$ref" and isinstance(value, str) and not value.startswith("#")
                  )
                  nodes.extend(node.values())
              elif isinstance(node, list):
                  nodes.extend(node)
          if refs != expected_refs:
              raise SystemExit(
                  "External schema refs mismatch; "
                  f"missing={sorted(expected_refs - refs)}, added={sorted(refs - expected_refs)}"
              )
          print(f"API surface unchanged: {len(operations)} operations, {len(refs)} external schema refs")
          PY

  bee-ci-unit:
    name: bee-ci/unit
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require unit test job
        run: test "${{ needs.test.result }}" = "success"

  bee-ci-contract:
    name: bee-ci/contract
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require contract test job
        run: test "${{ needs.test.result }}" = "success"

  bee-ci-release-assets:
    name: bee-ci/release-assets
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require release-assets build job
        run: test "${{ needs.test.result }}" = "success"

  bee-ci-installer-dry-run:
    name: bee-ci/installer-dry-run
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require installer dry-run job
        run: test "${{ needs.test.result }}" = "success"

  bee-ci-scan:
    name: bee-ci/scan
    if: always()
    needs: [scan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require scan job
        run: test "${{ needs.scan.result }}" = "success"

  ci:
    name: CI
    if: always()
    needs: [test, scan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require test and scan
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.scan.result }}" = "success"

  owner-held:
    name: owner-held
    # Enforced through ci-gate, the single required check, so no ruleset change
    # is needed: a pull request labelled `owner-held` fails this job and ci-gate
    # (which needs it) cannot pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report labels and enforce the owner-held hold
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/owner_held.py "$GITHUB_EVENT_PATH"

  lease-tamper:
    name: lease-tamper
    # Required through ci-gate. Every pull request must resolve a slice
    # contract; after the verify boundary only scope.assigned_files may change
    # and scope.test_files/scope.prohibited are frozen. Applies to every
    # author, including the coordinator and triage lanes. Canonical script and
    # docs: mojomast/workflow .github/scripts/lease_tamper.py and
    # docs/32-lease-tamper-gate.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # merge_group: prove each queued PR's head already passed this job by
      # reading its check runs (GET /commits/{sha}/check-runs).
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lease/tamper gate unit tests
        run: python3 -m unittest tests.test_lease_tamper -v
      - name: Enforce the slice lease and frozen tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/lease_tamper.py "$GITHUB_EVENT_PATH"

  ci-gate:
    name: ci-gate
    # The main ruleset requires this one check. It passes only when every job
    # in this file succeeded, so new jobs must be added to needs (checked below).
    if: ${{ always() }}
    needs:
      - windows-provisioning
      - test
      - scan
      - contract-yaml
      - bee-ci-unit
      - bee-ci-contract
      - bee-ci-release-assets
      - bee-ci-installer-dry-run
      - bee-ci-scan
      - ci
      - owner-held
      - lease-tamper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-gate needs every job in this file
        run: python3 .github/scripts/check_ci_gate.py .github/workflows/ci.yml
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          failed = sorted(job for job, result in results.items() if result != "success")
          if failed or not results:
              print("ci-gate FAILED: " + (", ".join(failed) or "no jobs"))
              sys.exit(1)
          PY
