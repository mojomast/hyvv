name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

# Least privilege at the workflow level; jobs request only what they need.
permissions: {}

jobs:
  windows-provisioning:
    # The full Windows matrix stays deferred (Kyle, Nov 12). Provisioning needs
    # real Windows path/reparse semantics, so this job runs only its tests.
    name: provisioning (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Provisioning tests
        shell: bash
        run: |
          uv sync --frozen --no-dev || uv sync --no-dev
          uv run python -m unittest tests.test_provisioning tests.test_provisioning_api tests.test_provisioning_convergence -v

  test:
    name: test
    runs-on: ${{ matrix.os }}
    # Windows legs are deferred (Kyle, Nov 12): windows-latest is out of the matrix.
    # A job-level `if` cannot read `matrix`, and GitHub rejects the whole workflow
    # when it tries, so the leg is removed rather than skipped. Re-add it here.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync and unit tests
        run: |
          uv sync --frozen --no-dev || uv sync --no-dev
          uv run python -m unittest discover -s tests -v

      - name: Contract tests (/v1, in-process hyvv)
        # Same command a reviewer runs locally. Point it at a live host with
        # HYVV_BASE_URL plus HYVV_TOKEN_FILE (read-only unless --writes).
        run: uv run python -m contract -v

      - name: Release assets (build only; no tag, sign or upload)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist release-assets
          uv build
          uv run python scripts/build_release_assets.py --dist dist --out release-assets
          # dist/ is what PyPI gets: exactly the sdist and the wheel.
          test "$(ls dist | wc -l | tr -d ' ')" = 2
          ls dist/*.tar.gz dist/*.whl
          ls dist release-assets

      - name: Installer dry run
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File scripts/install.ps1 -WhatIf
          else
            sh scripts/install.sh --dry-run
          fi

  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: gitleaks
        run: |
          set -euo pipefail
          ver=8.28.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Host and tailnet grep
        run: bash scripts/scan-secrets.sh

  ci:
    name: CI
    if: always()
    needs: [test, scan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require test and scan
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.scan.result }}" = "success"
