name: testpypi-rehearsal

# Rehearses the PyPI trusted-publishing path on test.pypi.org before the first
# real release (rizzstack decision 7). Manual dispatch only: it never runs on a
# tag, never creates a tag or GitHub Release, and never uploads to pypi.org.
# The real publish stays in release.yml (tag-driven, `pypi` environment with
# the owner as required reviewer).
#
# One-time setup on test.pypi.org (owner, browser): add a pending trusted
# publisher for project `hyvv`, owner `mojomast`, repository `hyvv`, workflow
# `testpypi-rehearsal.yml`, environment `testpypi`.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: testpypi-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    name: build-publish-testpypi
    if: github.repository == 'mojomast/hyvv' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Give this build a unique dev version (TestPyPI never takes a version twice)
        shell: bash
        run: |
          base="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          version="${base}.dev${GITHUB_RUN_ID}"
          sed -i "s/^version = \"${base}\"$/version = \"${version}\"/" pyproject.toml
          grep -qx "version = \"${version}\"" pyproject.toml
          echo "Rehearsal version: ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build sdist and wheel
        run: uv build

      - name: Same dist check as the release (only the sdist and wheel for this version)
        run: uv run --no-project python scripts/build_release_assets.py --dist dist --out release-assets

      - name: Publish to TestPyPI (trusted publishing; sdist and wheel only)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          attestations: true
