openapi: 3.1.0
info:
  title: hyvv worker-host API
  version: v1
  description: |
    Versioned worker-host contract for hyvv. `/v1` only ever gets additive
    changes. A breaking change is published as `/v2` and served alongside
    `/v1` for at least one release.

    hyvv is a vocabulary, not a dependency on bundlebees.

    Every operation carries `x-hyvv-status`, one of: `launcher-0.1.19`
    (implemented in launcher 0.1.18), `reference` (implemented only in the
    /v1 reference, contract/v1/reference.py), `specified` (specified, not
    implemented), or `proposed`. contract/v1/STATUS.json is the source and
    tests/test_status_labels.py keeps the labels honest. Items marked
    `x-proposal` are proposed additions (see contract/v1/proposals/).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Local hyvv host (loopback or Tailscale only)
tags:
  - name: meta
  - name: attempts
  - name: artifacts
  - name: host
  - name: leases
paths:
  /v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: API version and capabilities
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Version and capability advertisement
          content:
            application/json:
              schema:
                $ref: schemas/version.json
              examples:
                v1:
                  value:
                    api_version: v1
                    version: "0.1.18+25.g7f73b7c"
                    release: "0.1.18"
                    build:
                      version: "0.1.18+25.g7f73b7c"
                      release: "0.1.18"
                      tag: "v0.1.18"
                      commits_past_tag: 25
                      describe: "v0.1.18-25-g7f73b7c"
                      sha: "7f73b7c0b2f7a1d4c7f0b9e6a3d2c1b0a9f8e7d6"
                      short_sha: "7f73b7c"
                      dirty: false
                      source: git
                    capabilities:
                      - priority_routing
                      - go_fallback
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness and host counters
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: {type: boolean}
                  version:
                    type: string
                    description: >-
                      The build the launcher is running (git describe based). Only a clean checkout
                      exactly at the tag answers the bare release; a build off the tag carries
                      `+<commits>.g<sha>`.
                  release: {type: string, description: The release the source sits on.}
                  build:
                    description: Where the reported version came from and the commit it names.
                    type: object
                    required: [version, dirty, source]
                    additionalProperties: false
                    properties:
                      version: {type: string}
                      release: {type: string}
                      tag: {type: [string, "null"]}
                      commits_past_tag: {type: [integer, "null"]}
                      describe: {type: [string, "null"]}
                      sha: {type: [string, "null"]}
                      short_sha: {type: [string, "null"]}
                      dirty: {type: boolean}
                      source: {enum: [git, baked, receipt, unknown]}
                  deployment_receipt:
                    description: >-
                      Present when the admin apply-update wrote hyvv-deployed.json. Either the
                      validated identity it recorded (deployed_at with version and/or rev and/or
                      describe), or a status: invalid marker -- never other receipt content or a path.
                    oneOf:
                      - type: object
                        required: [deployed_at]
                        properties:
                          deployed_at: {type: string, format: date-time}
                          version: {type: string, pattern: '^[0-9]+(\.[0-9]+){1,3}(\+[a-z0-9]+(\.[a-z0-9]+)*)?$'}
                          rev: {type: string, pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}
                          describe: {type: string, pattern: '^v?[0-9]+(\.[0-9]+){1,3}(-[0-9]+-g[0-9a-f]{7,40})?(-dirty)?$'}
                        additionalProperties: false
                      - type: object
                        required: [status, reason]
                        properties:
                          status: {const: invalid}
                          reason: {enum: [receipt_unreadable, receipt_malformed]}
                        additionalProperties: false
                  max_concurrent: {type: integer}
                  active: {type: integer}
                  journal_active: {type: integer, description: Disk journal entries in starting, running, or cancel_requested.}
                  journal_tmp: {type: integer, description: Leftover attempts/*.tmp files from a failed journal replace.}
                  split_brain: {type: boolean, description: True when live active and journal_active differ, or leftover tmp files remain.}
                  queued: {type: integer}
                  model: {type: string}
                  uptime_s: {type: number}
                  loop_lag_ms: {type: number}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/attempts:
    get:
      tags: [attempts]
      operationId: listAttempts
      summary: List attempts (public and lease fields only; newest 200)
      description: Responses never include patch text, brief objective text, host names, or runtime paths.
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      parameters:
        - name: active
          in: query
          schema:
            type: string
            enum: ["1", "true"]
          description: If set, only non-terminal attempts are returned.
      responses:
        "200":
          description: Attempt list
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts:
                    type: array
                    items:
                      $ref: schemas/attempt.json
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [attempts]
      operationId: createAttempt
      summary: Create an attempt (idempotent if attempt_id already exists)
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief]
              properties:
                attempt_id:
                  type: string
                  description: If omitted, hyvv mints `att_` plus 16 hex characters.
                brief:
                  type: object
                  required: [objective]
                  additionalProperties: true
                  properties:
                    objective: {type: string}
                    project: {type: string}
                    branch: {type: string}
                    source_rev: {type: string}
                    assigned_files:
                      type: array
                      items: {type: string}
                    priority:
                      type: string
                      description: >
                        An explicitly named model or tier is authoritative; priority: high
                        reroutes only a brief that names no model to the official DeepSeek
                        route (priority_routing).
                model: {type: string}
                kind: {type: string}
                mode: {type: string}
                coordinator:
                  type: string
                  deprecated: true
                  description: >
                    Ignored for authorization. The owning coordinator is the
                    principal authenticated by the request's coordinator key.
                project_state_generation:
                  type: integer
                  minimum: 0
                  description: >
                    Reference only (x-hyvv-status reference; not launcher 0.1.18).
                    Required with `project`: the `generation` of
                    .workflow/project-state.json the dispatcher gated on (0 when the
                    file is absent). hyvv re-reads the file and refuses with 409
                    project_state_changed if it differs (workflow docs/18, AC-PARK-22).
                project_parked_override:
                  type: boolean
                  description: >
                    Reference only. Together with a non-empty reason, allows an
                    attempt on a parked or archived project. Attributed to the
                    authenticated principal and persisted. Does not bypass an
                    invalid state file or a generation mismatch.
                project_parked_override_reason:
                  type: string
                  description: Required (non-empty) when project_parked_override is true. Persisted with the override.
      responses:
        "200":
          description: Existing attempt (idempotent replay)
          content:
            application/json:
              schema:
                $ref: schemas/attempt.json
        "201":
          description: >
            Created. When artifact_fetch is available, the body also carries
            `artifact_capability` (and `artifact_capability_expires_at` when a
            TTL applies). It is returned only here, only to the creating
            principal, and never again (not on idempotent replay, GET or list).
          content:
            application/json:
              schema:
                $ref: schemas/attempt.json
        "400":
          description: >
            Invalid brief or attempt_id. Reference only: invalid_project_state
            (the state file is present but invalid, unreadable, oversized, a
            symlink, or its snapshot_path fails containment; `detail` is one of
            snapshot_path_invalid, snapshot_path_symlink, snapshot_path_escape,
            snapshot_missing) and override_reason_required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Project is not authorized on this host (reference code project_not_authorized)
        "409":
          description: >
            Reference only (contract/v1/project_state.py; not launcher 0.1.18),
            per workflow docs/18-parking-projects.md at 2bcf0c5.
            project_parked or project_archived when the project's
            .workflow/project-state.json is parked or archived and no override
            plus reason was given; project_state_changed when
            project_state_generation is missing or differs from the file, or
            the file's generation is not its history length.
          x-hyvv-feature-status: reference
          content:
            application/json:
              schema:
                $ref: schemas/error.json
              example:
                code: project_parked
                error: project_parked
                message: project is parked
                state: parked
                reason: waiting on a review
                at: "2026-11-12T21:00:00Z"
                by: human:owner
                project: example-project
                generation: 2

  /v1/attempts/{attempt_id}:
    get:
      tags: [attempts]
      operationId: getAttempt
      summary: Public fields for one attempt (no patch, no host paths)
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Public attempt
          content:
            application/json:
              schema:
                $ref: schemas/attempt.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown attempt

  /v1/attempts/{attempt_id}/events:
    get:
      tags: [attempts]
      operationId: getAttemptEvents
      summary: Events since a cursor (no patch text)
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - name: cursor
          in: query
          schema: {type: integer, default: 0}
      responses:
        "200":
          description: Event page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown attempt

  /v1/attempts/{attempt_id}/result:
    get:
      tags: [attempts]
      operationId: getAttemptResultLegacy
      summary: Legacy full result manifest
      description: |
        Historical endpoint. The manifest may include host and work-dir fields.
        Coordinators must use `GET /v1/attempts/{attempt_id}/artifact` once
        `artifact_fetch` ships.
      x-hyvv-status: launcher-0.1.19
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Result manifest (`orbit.local-worker.result/v1`)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown attempt
        "409":
          description: No result yet

  /v1/attempts/{attempt_id}/artifact:
    get:
      tags: [artifacts]
      operationId: getAttemptArtifact
      summary: Coordinator-only artifact fetch
      x-hyvv-status: reference
      x-capability: artifact_fetch
      security:
        - coordinatorKey: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - name: X-Hyvv-Capability
          in: header
          required: true
          schema: {type: string, pattern: "^hyvvcap1_[A-Za-z0-9_-]{43}$"}
          description: >
            The attempt's scoped capability, returned once in the 201 response
            to POST /v1/attempts (`artifact_capability`). Bound to this attempt,
            scoped to its artifact and result, compared by hash in constant
            time, and subject to expiry and revocation. The caller's
            coordinator identity comes from its bearer key (`coordinatorKey`),
            never from a request field.
      responses:
        "200":
          description: `hyvv.worker-artifact/1`
          content:
            application/json:
              schema:
                $ref: schemas/artifact.json
        "400":
          $ref: "#/components/responses/ArtifactError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ArtifactError"
        "404":
          $ref: "#/components/responses/ArtifactError"
        "409":
          $ref: "#/components/responses/ArtifactError"
        "413":
          $ref: "#/components/responses/ArtifactError"
        "502":
          $ref: "#/components/responses/ArtifactError"
        "503":
          $ref: "#/components/responses/ArtifactError"

  /v1/attempts/{attempt_id}/review:
    post:
      tags: [attempts]
      operationId: reviewAttempt
      summary: Record a coordinator verdict
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted: {type: boolean}
                note: {type: string}
      responses:
        "200":
          description: Updated attempt
        "400":
          description: accepted must be a boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown attempt
        "409":
          description: Attempt is not in a reviewable state

  /v1/attempts/{attempt_id}/cancel:
    post:
      tags: [attempts]
      operationId: cancelAttempt
      summary: Cancel an attempt
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "202":
          description: Cancel accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown attempt

  /v1/projects:
    get:
      tags: [host]
      operationId: listProjects
      summary: Authorized project names only (no paths, repos, or branches)
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project names
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/containers:
    get:
      tags: [host]
      operationId: getContainerProfile
      summary: Sandbox image profile (not live containers)
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Image profile
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/config:
    post:
      tags: [host]
      operationId: patchRuntimeConfig
      summary: Runtime-only max_concurrent change (not written to disk)
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_concurrent]
              properties:
                max_concurrent: {type: integer, minimum: 1, maximum: 10}
      responses:
        "200":
          description: Applied
        "400":
          description: Invalid max_concurrent
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/route:
    post:
      tags: [host]
      operationId: previewRoute
      summary: Preview model routing without starting an attempt
      description: >
        Resolves the request with the dispatch model selector. The response carries
        credential-presence booleans only, never credential values or provider endpoints.
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model: {type: string}
                tier: {type: string}
                kind: {type: string, enum: [opencode]}
                project: {type: string}
                brief:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Resolved route and credential-presence booleans
        "400":
          description: Unknown model or unsupported attempt kind
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/provision/capabilities:
    get:
      tags: [host]
      operationId: getProvisioningCapabilities
      summary: Advertise host-enrolled provisioning capabilities
      description: A disabled host returns enabled false and never advertises an enrolled profile.
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provisioning schema, enablement, profiles, and supported operations
          content:
            application/json:
              schema:
                type: object
                required: [schema, enabled, profiles]
                properties:
                  schema: {const: rizzstack.provisioning/1}
                  enabled: {type: boolean}
                  profiles:
                    type: array
                    items: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/capacity:
    get:
      tags: [host]
      operationId: getCapacity
      summary: Admission inputs for a coordinator that fills bee slots
      description: >-
        Every attempt this launcher sees (any coordinator), counted by provider lane, plus host
        memory and CPU, a cached read-only Docker probe and recent provider rate limits per lane.
        Unknown values are null, never guessed, so a caller can fail closed. Never carries tokens,
        paths, hosts or provider URLs.
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: hyvv.capacity/1
          content:
            application/json:
              schema:
                type: object
                required: [schema, observed_at, max_concurrent, active, queued, split_brain,
                           active_by_lane, queued_by_lane, host, docker, rate_limits]
                properties:
                  schema: {const: hyvv.capacity/1}
                  observed_at: {type: number}
                  max_concurrent: {type: integer}
                  active: {type: integer}
                  queued: {type: integer}
                  split_brain: {type: boolean}
                  active_by_lane:
                    type: object
                    description: Lanes are kimi, nous, go and other (by provider key).
                    additionalProperties: {type: integer}
                  queued_by_lane:
                    type: object
                    additionalProperties: {type: integer}
                  host:
                    type: object
                    properties:
                      mem_total_mb: {type: [integer, "null"]}
                      mem_available_mb: {type: [integer, "null"]}
                      cpu_count: {type: [integer, "null"]}
                      cpu_busy_pct: {type: [number, "null"]}
                  docker:
                    type: object
                    description: Cached `docker info` probe (read-only, bounded by a timeout); ok is null when never probed or stale.
                    properties:
                      ok: {type: [boolean, "null"]}
                      age_s: {type: [number, "null"]}
                      ncpu: {type: [integer, "null"]}
                      mem_total_mb: {type: [integer, "null"]}
                      containers_running: {type: [integer, "null"]}
                      detail: {type: string}
                  rate_limits:
                    type: object
                    properties:
                      window_s: {type: integer}
                      by_lane:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            count: {type: integer}
                            last_at: {type: [number, "null"]}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/landing/events:
    get:
      tags: [host]
      operationId: exportLandingEvents
      summary: Export durable canonical landing events
      description: Read-only, cursor-paginated export of the stored canonical outbox.
      x-hyvv-status: launcher-0.1.19
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          schema: {type: string}
          description: Durable export position after which to resume.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500}
      responses:
        "200":
          description: Canonical event page and next durable export position
        "400":
          description: Invalid, expired, unknown, or incompatible cursor or limit
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Conflicting stored landing content
        "503":
          description: Landing export storage is temporarily unavailable

  /v1/leases:
    get:
      tags: [leases]
      operationId: listLeases
      summary: List live bee-slot leases and cap usage
      x-hyvv-status: specified
      x-capability: leases
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live leases and caps
          content:
            application/json:
              schema:
                $ref: schemas/lease-list.json
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [leases]
      operationId: acquireLease
      summary: Acquire bee slots
      x-hyvv-status: specified
      x-capability: leases
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/lease-create.json
      responses:
        "201":
          description: Lease issued
          content:
            application/json:
              schema:
                $ref: schemas/lease.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Global, coordinator, or CI cap would be exceeded
          headers:
            Retry-After:
              description: Seconds until a slot is expected to free
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema:
                $ref: schemas/error.json
              example:
                code: capacity_exhausted
                error: capacity_exhausted
                message: global cap 12 is full
                retryable: true

  /v1/leases/{lease_id}:
    delete:
      tags: [leases]
      operationId: releaseLease
      summary: Release a lease immediately
      x-hyvv-status: specified
      x-capability: leases
      security:
        - bearerAuth: []
      parameters:
        - name: lease_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204":
          description: Released
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown lease

  /v1/leases/{lease_id}/renew:
    post:
      tags: [leases]
      operationId: renewLease
      summary: Renew a live lease
      x-hyvv-status: specified
      x-capability: leases
      security:
        - bearerAuth: []
      parameters:
        - name: lease_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: schemas/lease-renew.json
      responses:
        "200":
          description: Renewed lease
          content:
            application/json:
              schema:
                $ref: schemas/lease.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or expired lease


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-host token from the hyvv data directory. Required on every route.
    coordinatorKey:
      type: http
      scheme: bearer
      description: >
        Reference only (x-hyvv-status reference): a per-coordinator key that authenticates a principal. The
        host stores only key hashes. Used by artifact_fetch together with the
        attempt capability.
  parameters:
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'
  responses:
    Unauthorized:
      description: Missing or incorrect bearer token
      content:
        application/json:
          schema:
            $ref: schemas/error.json
          example:
            code: unauthorized
            error: unauthorized
            message: missing or incorrect bearer token
    ArtifactError:
      description: Artifact fetch error (`code` is one of the v1 artifact error codes)
      content:
        application/json:
          schema:
            $ref: schemas/error.json
